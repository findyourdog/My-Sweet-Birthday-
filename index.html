
<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eliza's 25th Birthday</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Noto+Serif+Armenian:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --cream: #f8f4ed;
  --champagne: #d8c1a0;
  --gold: #b99b70;
  --mocha: #665348;
  --dark: #493a32;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--cream);
  color: var(--dark);
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
}

.page {
  min-height: 100vh;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  text-align: center;
  background:
    radial-gradient(ellipse at 50% 35%, #fffdf9 0%, #f8f4ed 65%, #eee4d8 100%);
}

/* Soft light */

.page::before {
  content: "";
  position: absolute;
  width: 600px;
  height: 600px;
  border-radius: 50%;
  background: rgba(255,255,255,0.55);
  filter: blur(80px);
  top: 10%;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
}

.content {
  position: relative;
  z-index: 5;
  width: 100%;
  max-width: 700px;
  animation: fadeIn 2s ease both;
}

.small-title {
  font-size: 11px;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: #9d846d;
  margin-bottom: 28px;
  animation: fadeIn 1.5s ease both;
}

.number-area {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 270px;
  margin-bottom: 5px;
}

.number {
  font-family: 'DM Sans', sans-serif;
  font-size: clamp(150px, 30vw, 260px);
  font-weight: 300;
  line-height: 1;
  letter-spacing: -18px;
  padding-right: 18px;

  background: linear-gradient(
    145deg,
    #fff9ed 5%,
    #e8d4b7 25%,
    #c6a77e 48%,
    #f5e5cd 65%,
    #b18d65 90%
  );

  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;

  filter: drop-shadow(0 12px 15px rgba(113, 82, 54, 0.15));

  animation: numberAppear 2s cubic-bezier(.2,.8,.2,1) both;
}

/* Side numbers */

.side-number {
  position: absolute;
  top: 50%;
  font-size: 65px;
  font-weight: 300;
  color: rgba(190, 159, 121, 0.25);
  transform: translateY(-50%);
  animation-duration: 2s;
  animation-fill-mode: both;
}

.left-number {
  left: 2%;
  animation-name: slideLeft;
}

.right-number {
  right: 2%;
  animation-name: slideRight;
}

/* Invitation text */

h1 {
  font-family: 'Noto Serif Armenian', serif;
  font-weight: 400;
  font-size: clamp(23px, 5vw, 36px);
  letter-spacing: 1px;
  margin-top: 8px;
  color: var(--mocha);
}

.subtitle {
  font-size: 12px;
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-top: 13px;
  color: #a38b73;
}

.line {
  width: 55px;
  height: 1px;
  background: var(--champagne);
  margin: 30px auto;
}

.invitation {
  font-family: 'Noto Serif Armenian', serif;
  font-size: 16px;
  line-height: 2;
  color: #79695d;
  max-width: 440px;
  margin: 0 auto;
}

.details {
  margin-top: 34px;
  display: flex;
  justify-content: center;
  gap: 35px;
  flex-wrap: wrap;
}

.detail {
  min-width: 110px;
}

.detail-label {
  font-size: 10px;
  letter-spacing: 3px;
  color: #aa9178;
  text-transform: uppercase;
  margin-bottom: 9px;
}

.detail-value {
  font-size: 15px;
  color: var(--mocha);
  font-weight: 500;
}

.address {
  font-family: 'Noto Serif Armenian', serif;
  font-size: 13px;
  margin-top: 9px;
  color: #8c7968;
}

.footer {
  margin-top: 48px;
  font-size: 10px;
  letter-spacing: 4px;
  color: #aa9178;
  text-transform: uppercase;
}

/* Floating balloons */

.balloon {
  position: absolute;
  bottom: -180px;
  width: 75px;
  height: 95px;
  border-radius: 50% 50% 45% 45%;
  opacity: 0;
  z-index: 2;
  animation: floatUp linear infinite;
  box-shadow:
    inset -12px -12px 20px rgba(90, 65, 45, 0.10),
    inset 10px 8px 18px rgba(255,255,255,0.65),
    0 10px 25px rgba(100,75,50,0.08);
}

.balloon::before {
  content: "";
  position: absolute;
  width: 9px;
  height: 10px;
  background: inherit;
  bottom: -5px;
  left: 50%;
  transform: translateX(-50%) rotate(45deg);
}

.balloon::after {
  content: "";
  position: absolute;
  width: 1px;
  height: 95px;
  background: rgba(157, 128, 99, 0.35);
  top: 100%;
  left: 50%;
}

.b1 {
  left: 7%;
  background: radial-gradient(circle at 30% 25%, #fffaf1, #e9d8bd 60%, #c9ae8c);
  animation-duration: 17s;
  animation-delay: 1s;
}

.b2 {
  left: 22%;
  width: 55px;
  height: 72px;
  background: radial-gradient(circle at 30% 25%, #fff, #e7dfd3 65%, #c6b7a4);
  animation-duration: 21s;
  animation-delay: 5s;
}

.b3 {
  right: 9%;
  background: radial-gradient(circle at 30% 25%, #fff9ef, #dfc8a7 60%, #b9966e);
  animation-duration: 19s;
  animation-delay: 3s;
}

.b4 {
  right: 25%;
  width: 60px;
  height: 78px;
  background: radial-gradient(circle at 30% 25%, #fff, #eee3d5 60%, #cdbba6);
  animation-duration: 23s;
  animation-delay: 8s;
}

.b5 {
  left: 45%;
  width: 48px;
  height: 63px;
  background: radial-gradient(circle at 30% 25%, #fffaf1, #e8d3b5 60%, #c3a27c);
  animation-duration: 20s;
  animation-delay: 11s;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) translateX(0) rotate(-8deg);
    opacity: 0;
  }
  10% {
    opacity: 0.95;
  }
  50% {
    transform: translateY(-65vh) translateX(25px) rotate(8deg);
  }
  90% {
    opacity: 0.9;
  }
  100% {
    transform: translateY(-125vh) translateX(-15px) rotate(-8deg);
    opacity: 0;
  }
}

@keyframes numberAppear {
  0% {
    opacity: 0;
    transform: scale(.55);
    filter: blur(10px);
  }
  100% {
    opacity: 1;
    transform: scale(1);
    filter: drop-shadow(0 12px 15px rgba(113,82,54,.15));
  }
}

@keyframes slideLeft {
  from { opacity: 0; transform: translate(-100px,-50%); }
  to { opacity: 1; transform: translate(0,-50%); }
}

@keyframes slideRight {
  from { opacity: 0; transform: translate(100px,-50%); }
  to { opacity: 1; transform: translate(0,-50%); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Mobile */

@media (max-width: 600px) {
  .page {
    padding: 55px 18px;
    min-height: 100svh;
  }

  .number-area {
    min-height: 210px;
  }

  .number {
    font-size: 175px;
    letter-spacing: -13px;
  }

  .side-number {
    font-size: 40px;
  }

  .left-number {
    left: 0;
  }

  .right-number {
    right: 0;
  }

  .small-title {
    letter-spacing: 4px;
  }

  .details {
    gap: 25px;
  }

  .invitation {
    font-size: 14px;
  }

  .balloon {
    transform: scale(.75);
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>

<main class="page">

  <!-- Floating balloons -->
  <div class="balloon b1"></div>
  <div class="balloon b2"></div>
  <div class="balloon b3"></div>
  <div class="balloon b4"></div>
  <div class="balloon b5"></div>

  <section class="content">

    <div class="small-title">A special celebration</div>

    <div class="number-area">
      <span class="side-number left-number">25</span>
      <div class="number">25</div>
      <span class="side-number right-number">25</span>
    </div>

    <h1>Էլիզայի 25-ամյակ</h1>
    <div class="subtitle">Birthday invitation</div>

    <div class="line"></div>

    <p class="invitation">
      Սիրով հրավիրում եմ քեզ միասին նշելու
      իմ կյանքի այս գեղեցիկ օրը։
      <br>
      Սպասում եմ քեզ՝ այս օրը միասին
      անմոռանալի դարձնելու։
    </p>

    <div class="details">

      <div class="detail">
        <div class="detail-label">Date</div>
        <div class="detail-value">November 25</div>
      </div>

      <div class="detail">
        <div class="detail-label">Time</div>
        <div class="detail-value">19:00</div>
      </div>

      <div class="detail">
        <div class="detail-label">Place</div>
        <div class="detail-value">Apres Restaurant</div>
        <div class="address">Խանջյան 2/9, Երևան</div>
      </div>

    </div>

    <div class="footer">Can't wait to see you</div>

  </section>

</main>

</body>
</html>
