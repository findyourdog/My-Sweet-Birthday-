<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eliza's 25th Birthday</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Noto+Serif+Armenian:wght@400;500&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #f8f4ed;
  color: #665348;
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
}

.page {
  min-height: 100vh;
  min-height: 100svh;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 50px 20px;
  overflow: hidden;
  background: radial-gradient(circle at center, #fffdf9, #f8f4ed 75%);
}

.content {
  position: relative;
  z-index: 3;
  width: 100%;
  max-width: 650px;
  text-align: center;
  animation: appear 1.5s ease-out both;
}

.eyebrow {
  font-size: 11px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: #a58a6d;
  margin-bottom: 25px;
}

.number-wrap {
  position: relative;
  margin: 0 auto;
  width: 100%;
  height: 250px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.number {
  font-size: clamp(145px, 28vw, 230px);
  font-weight: 300;
  line-height: 1;
  letter-spacing: -14px;
  padding-right: 14px;
  color: #c6a77e;
  background: linear-gradient(135deg, #f5e8d4, #b99569, #e8d2b1, #ad8b66);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: zoomIn 1.8s ease-out both;
}

.side {
  position: absolute;
  top: 50%;
  font-size: 48px;
  font-weight: 300;
  color: #d9c6ad;
  transform: translateY(-50%);
  opacity: 0;
  animation: sideIn 1.5s ease-out 0.5s forwards;
}

.side.left {
  left: 4%;
}

.side.right {
  right: 4%;
}

h1 {
  font-family: 'Noto Serif Armenian', serif;
  font-size: clamp(23px, 5vw, 34px);
  font-weight: 400;
  margin-top: 15px;
  color: #665348;
}

.subtitle {
  margin-top: 12px;
  font-size: 11px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: #aa9075;
}

.separator {
  width: 50px;
  height: 1px;
  background: #cdb493;
  margin: 30px auto;
}

.message {
  font-family: 'Noto Serif Armenian', serif;
  font-size: 15px;
  line-height: 2;
  color: #857365;
  max-width: 420px;
  margin: auto;
}

.details {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 35px;
  margin-top: 35px;
}

.detail-title {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #ad9276;
  margin-bottom: 10px;
}

.detail-value {
  font-size: 15px;
  font-weight: 500;
  color: #665348;
}

.address {
  font-family: 'Noto Serif Armenian', serif;
  font-size: 12px;
  margin-top: 7px;
  color: #8e7c6b;
}

.footer {
  margin-top: 45px;
  font-size: 10px;
  letter-spacing: 4px;
  color: #b29a7e;
  text-transform: uppercase;
}

/* Balloons */

.balloon {
  position: absolute;
  bottom: -160px;
  width: 65px;
  height: 85px;
  border-radius: 50% 50% 45% 45%;
  z-index: 1;
  opacity: 0;
  animation: float 18s linear infinite;
  box-shadow:
    inset -10px -12px 18px rgba(110, 80, 50, .10),
    inset 9px 8px 15px rgba(255,255,255,.8),
    0 8px 20px rgba(90,70,50,.08);
}

.balloon::before {
  content: "";
  position: absolute;
  bottom: -5px;
  left: 50%;
  width: 9px;
  height: 9px;
  background: inherit;
  transform: translateX(-50%) rotate(45deg);
}

.balloon::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 50%;
  height: 95px;
  width: 1px;
  background: rgba(150,120,90,.35);
}

.balloon:nth-child(1) {
  left: 8%;
  background: radial-gradient(circle at 30% 25%, #fffaf0, #e8d3b5 65%, #c6a77e);
  animation-delay: 0s;
  animation-duration: 19s;
}

.balloon:nth-child(2) {
  left: 25%;
  width: 50px;
  height: 68px;
  background: radial-gradient(circle at 30% 25%, #fff, #e6ddd0 65%, #c6b7a4);
  animation-delay: 5s;
  animation-duration: 22s;
}

.balloon:nth-child(3) {
  right: 8%;
  background: radial-gradient(circle at 30% 25%, #fffaf0, #e8d3b5 65%, #c6a77e);
  animation-delay: 3s;
  animation-duration: 20s;
}

.balloon:nth-child(4) {
  right: 25%;
  width: 52px;
  height: 70px;
  background: radial-gradient(circle at 30% 25%, #fff, #e6ddd0 65%, #c6b7a4);
  animation-delay: 8s;
  animation-duration: 23s;
}

.balloon:nth-child(5) {
  left: 50%;
  width: 45px;
  height: 60px;
  background: radial-gradient(circle at 30% 25%, #fffaf0, #e8d3b5 65%, #c6a77e);
  animation-delay: 11s;
  animation-duration: 21s;
}

@keyframes float {
  0% {
    transform: translateY(0) translateX(0) rotate(-7deg);
    opacity: 0;
  }
  12% {
    opacity: .9;
  }
  50% {
    transform: translateY(-65vh) translateX(25px) rotate(7deg);
  }
  90% {
    opacity: .9;
  }
  100% {
    transform: translateY(-125vh) translateX(-15px) rotate(-7deg);
    opacity: 0;
  }
}

@keyframes appear {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes zoomIn {
  from { opacity: 0; transform: scale(.65); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes sideIn {
  from { opacity: 0; }
  to { opacity: .7; }
}

@media (max-width: 600px) {
  .page {
    padding: 35px 16px;
  }

  .number-wrap {
    height: 195px;
  }

  .number {
    font-size: 165px;
  }

  .side {
    font-size: 30px;
  }

  .side.left {
    left: 0;
  }

  .side.right {
    right: 0;
  }

  .details {
    gap: 25px;
  }

  .message {
    font-size: 13px;
  }

  .balloon {
    transform: scale(.8);
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    opacity: 1 !important;
  }
}
</style>
</head>

<body>

<main class="page">

  <div class="balloon"></div>
  <div class="balloon"></div>
  <div class="balloon"></div>
  <div class="balloon"></div>
  <div class="balloon"></div>

  <section class="content">

    <div class="eyebrow">A special celebration</div>

    <div class="number-wrap">
      <span class="side left">25</span>
      <div class="number">25</div>
      <span class="side right">25</span>
    </div>

    <h1>Էլիզայի 25-ամյակ</h1>
    <div class="subtitle">Birthday invitation</div>

    <div class="separator"></div>

    <p class="message">
      Սիրով հրավիրում եմ քեզ միասին նշելու
      իմ կյանքի այս գեղեցիկ օրը։
      <br>
      Սպասում եմ քեզ՝ այս օրը միասին
      անմոռանալի դարձնելու։
    </p>

    <div class="details">

      <div>
        <div class="detail-title">Date</div>
        <div class="detail-value">November 25</div>
      </div>

      <div>
        <div class="detail-title">Time</div>
        <div class="detail-value">19:00</div>
      </div>

      <div>
        <div class="detail-title">Place</div>
        <div class="detail-value">Apres Restaurant</div>
        <div class="address">Խանջյան 2/9, Երևան</div>
      </div>

    </div>

    <div class="footer">Can't wait to see you</div>

  </section>

</main>

</body>
</html>
